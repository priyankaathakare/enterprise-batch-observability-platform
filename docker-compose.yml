version: '3.8'
services:
  api:
    build:.
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
  dashboard:
    build:.
    command: streamlit run dashboard/main.py --server.port 10000 --server.address 0.0.0.0
    ports:
      - "10000:10000"
    depends_on:
      - api